# Ubuntu/Debian: /etc/nginx/sites-available/autodevsecops
# Requires an existing TLS certificate. See README.md for first-time setup.
# Frontend: /var/www/autodevsecops-ai/dashboard (contents of Vite dist/)
# Backend:  http://127.0.0.1:4000

server {
    listen 80;
    listen [::]:80;
    server_name autodevsecops.spiritedrobot.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://autodevsecops.spiritedrobot.in$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name autodevsecops.spiritedrobot.in;

    ssl_certificate /etc/letsencrypt/live/autodevsecops.spiritedrobot.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autodevsecops.spiritedrobot.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/autodevsecops-ai/dashboard;
    index index.html;
    client_max_body_size 2m;

    # Keep API requests out of the frontend's index.html fallback.
    location = /api {
        default_type application/json;
        return 404 '{"error":{"message":"Use /api/v1/ endpoints"}}';
    }

    location ^~ /api/ {
        # No trailing slash: preserve /api/v1/... for the Express router.
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Stream SSE events immediately; allow long-running connections.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;

        # SSE authentication currently uses a token query parameter.
        access_log off;

        # Preserve backend errors; return JSON for Nginx upstream failures.
        proxy_intercept_errors off;
        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"error":{"message":"Control API unavailable. Check the backend service on port 4000."}}';
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~ /\. {
        deny all;
    }

    # React Router routes are handled by the frontend.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
