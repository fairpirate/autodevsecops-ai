# Temporary HTTP-only configuration for obtaining the first certificate.
# Replace with autodevsecops.conf after Certbot succeeds.
server {
    listen 80;
    listen [::]:80;
    server_name autodevsecops.spiritedrobot.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 503 "AutoDevSecOps HTTPS setup in progress.\n";
    }
}
